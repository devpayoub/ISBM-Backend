<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ISBM — Écran d'atelier</title>
  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0f172a;color:#e2e8f0;}
    header{padding:16px 24px;background:#1e293b;display:flex;justify-content:space-between;align-items:center;}
    h1{margin:0;font-size:24px;}
    .ticker{color:#94a3b8;font-size:14px;}
    main{padding:24px;}
    .alert-box{border:6px solid #334155;border-radius:12px;padding:32px;background:#111827;margin-bottom:24px;}
    .alert-box.CRITICAL{border-color:#ef4444;background:#7f1d1d;}
    .alert-box.MAJOR{border-color:#f59e0b;background:#78350f;}
    .alert-box.MINOR{border-color:#eab308;background:#422006;}
    .alert-box.INFO{border-color:#3b82f6;background:#1e3a8a;}
    .alert-title{font-size:44px;font-weight:bold;margin:0;}
    .alert-meta{font-size:22px;margin-top:16px;display:flex;gap:48px;flex-wrap:wrap;}
    .field{display:flex;flex-direction:column;}
    .field span:first-child{font-size:14px;color:#94a3b8;text-transform:uppercase;}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
    .card{padding:16px;border-radius:10px;background:#1e293b;}
    .card h3{margin:0 0 8px 0;font-size:16px;color:#94a3b8;}
    .card .v{font-size:32px;font-weight:bold;}
    .status-RUNNING{color:#10b981;} .status-STOPPED{color:#f59e0b;}
    .status-MAINTENANCE{color:#3b82f6;} .status-BREAKDOWN{color:#ef4444;}
    #history{margin-top:24px;font-size:14px;color:#94a3b8;}
    #history li{padding:4px 0;}
    .empty{font-size:28px;color:#64748b;padding:48px;text-align:center;}
  </style>
</head>
<body>
<header>
  <h1>ICIISBM — Supervision Atelier</h1>
  <div class="ticker" id="clock"></div>
</header>
<main>
  <section id="active-alert"></section>
  <section class="cards" id="machines-status"></section>
  <section id="history"><h3>Historique récent</h3><ul id="history-list"></ul></section>
</main>

<script>
const token = new URLSearchParams(location.search).get("token") || prompt("JWT token:");
const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/alerts/?token=${token}`);
ws.onmessage = (ev) => {
  const data = JSON.parse(ev.data);
  render(data);
};
ws.onclose = () => { document.body.insertAdjacentHTML("beforeend", "<p>WebSocket déconnecté.</p>"); };

setInterval(() => document.getElementById("clock").textContent = new Date().toLocaleString("fr-FR"), 1000);

const events = [];
function render(d){
  events.unshift(d);
  if (events.length > 20) events.pop();

  if (d.event && d.event.startsWith("alert.") && d.event !== "alert.commented") {
    const sev = d.severity || "INFO";
    const box = `<div class="alert-box ${sev}">
      <h1 class="alert-title">${d.title || ""}</h1>
      <div class="alert-meta">
        <div class="field"><span>Machine</span><b>${d.machine_code || "—"} ${d.machine_name || ""}</b></div>
        <div class="field"><span>Sévérité</span><b>${sev}</b></div>
        <div class="field"><span>Statut</span><b>${d.status || ""}</b></div>
        <div class="field"><span>Heure</span><b>${new Date(d.ts || Date.now()).toLocaleTimeString("fr-FR")}</b></div>
      </div>
    </div>`;
    document.getElementById("active-alert").innerHTML = box;
  } else {
    if (d.event === "machine.status_changed") {
      const cards = document.getElementById("machines-status");
      const card = `<div class="card"><h3>${d.machine_code}</h3><div class="v status-${d.new_status}">${d.new_status}</div></div>`;
      cards.insertAdjacentHTML("beforeend", card);
    }
  }
  const list = events.filter(e => e.event === "alert.created" || e.event === "alert.resolved").slice(0, 10);
  document.getElementById("history-list").innerHTML = list.map(e =>
    `<li>${new Date(e.ts).toLocaleTimeString()} — ${e.event} — ${e.machine_code} — ${e.title || ""}</li>`
  ).join("");
}
document.getElementById("active-alert").innerHTML = '<div class="empty">Aucune alerte active.</div>';
</script>
</body>
</html>
