[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    -p no:cacheprovider
    --reuse-db
markers =
    django_db: tests that touch the database
    xfail: expected to fail (see xfail markers in code for reason)
testpaths = tests
filterwarnings =
    error
    ignore::RuntimeWarning:django.db.backends.utils
    ignore:Accessing the database during app initialization:RuntimeWarning
    ignore::django.utils.deprecation.RemovedInDjango60Warning
    ignore::ResourceWarning
